components:
  schemas:
    ErrorResponse:
        type: object
        properties:
          status:
            type: string
            example: error
          error:
            type: string
            example: ORDER_NOT_FOUND
          message:
            type: string
            example: No se encontro el pedido
          details:
            type: string
            description: Solo aparece fuera de produccion
            example: No hay ningun pedido con id 000000000000000000000000
    SuccessResponse:
        type: object
        properties:
          status:
            type: string
            example: success
          message:
            type: string
            description: Solo en los endpoints que devuelven un mensaje
            example: Datos generados
          payload:
            type: object
            description: Es el contenido de la respuesta. La estructgura depende del endpoint.
    Document:
      type: object
      description: Metadatos del archivo. El archivo vive en uploads/, no en la base.
      properties:
        originalName:
          type: string
          description: Como se llamaba el archivo en la maquina del cliente
          example: dni.pdf
        fileName:
          type: string
          description: El nombre unico que le puso el servidor
          example: 1756431234567-482910375.pdf
        path:
          type: string
          description: Donde quedo guardado dentro del servidor
          example: uploads/documents/1756431234567-482910375.pdf
        mimeType:
          type: string
          enum: [application/pdf, image/jpeg, image/png, image/webp]
          example: application/pdf
        size:
          type: number
          description: Tamano en bytes, el maximo son 5 MB
          example: 24533
        type:
          type: string
          enum: [user_document, driver_license, delivery_proof]
          example: user_document
        uploadedAt:
          type: string
          format: date-time
          example: 2026-08-29T10:00:00.000Z
    Proof:
      type: object
      description: Metadatos del comprobante de entrega de un pedido.
      properties:
        originalName:
          type: string
          example: comprobante.jpg
        fileName:
          type: string
          example: 1756431234567-193847562.jpg
        path:
          type: string
          example: uploads/proofs/1756431234567-193847562.jpg
        mimeType:
          type: string
          enum: [application/pdf, image/jpeg, image/png, image/webp]
          example: image/jpeg
        size:
          type: number
          example: 88120
        type:
          type: string
          description: Lo pone la API, siempre es delivery_proof
          example: delivery_proof
        uploadedAt:
          type: string
          format: date-time
          example: 2026-08-29T10:00:00.000Z
    User:
      type: object
      properties:
        _id:
          type: string
          example: 68af3c9e12ab4d5e6f708192
        firstName:
          type: string
          example: Vickie
        lastName:
          type: string
          example: Gislason-Veum
        email:
          type: string
          example: vickie_gislason-veum@i3trfg.test.com
        role:
          type: string
          enum: [admin, customer, store]
          example: customer
        documents:
          type: array
          description: Metadatos de los archivos que subio el usuario
          items:
            $ref: '#/components/schemas/Document'
    Store:
      type: object
      properties:
        _id:
          type: string
          example: 6a8d8a04f9f39b9cc4149b09
        name:
          type: string
          example: Dach and Sons
        address:
          type: string
          example: 4190 Funk Overpass
        owner:
          type: string
          description: ID del usuario con rol store que es dueño del local
          example: 6a8d8a04f9f39b9cc4149b07
        isActive:
          type: boolean
          example: true
    OrderItem:
      type: object
      properties:
        name:
          type: string
          example: Empanadas de carne
        quantity:
          type: number
          example: 12
        price:
          type: number
          example: 800
    Order:
      type: object
      properties:
        _id:
          type: string
          example: 6a909afa7e25565871155f7c
        customer:
          type: string
          description: ID del cliente. En las consultas llega con nombre, apellido y email
          example: 6a8d8a04f9f39b9cc4149b04
        store:
          type: string
          description: ID del local. En las consultas llega con nombre y direccion
          example: 6a8d8a04f9f39b9cc4149b09
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        deliveryAddress:
          type: string
          example: Zeballos 1281
        total:
          type: number
          description: Lo calcula la API a partir de los items, no se envia
          example: 9600
        status:
          type: string
          enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
          example: created
        priority:
          type: string
          enum: [low, normal, high]
          example: normal
        proof:
          description: Comprobante de entrega. Es null hasta que se sube.
          allOf:
            - $ref: '#/components/schemas/Proof'