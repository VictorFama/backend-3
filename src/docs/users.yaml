paths:
  /api/users:
    get:
      summary: Lista de usuarios
      description: Devuelve los usuarios y se puede filtrar por rol.
      tags:
        - Users
      parameters:
        - name: role
          in: query
          required: false
          description: Filtra por rol. Uno de admin, customer o store.
          schema:
            type: string
            enum: [admin, customer, store]
        - name: page
          in: query
          required: false
          description: Numero de pagina, arranca en 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Cuantos registros devuelve por pagina.
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        "200":
          description: Lista de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        "400":
          description: El rol enviado no es valido (INVALID_USER_ROLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Crea un usuario
      description: Crea un usuario. El email no se puede repetir y el password nunca se envia en la respuesta.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
              properties:
                firstName:
                  type: string
                  example: Victor
                lastName:
                  type: string
                  example: Fama
                email:
                  type: string
                  example: victor@test.com
                password:
                  type: string
                  example: "579135"
                role:
                  type: string
                  enum: [admin, customer, store]
                  example: customer
      responses:
        "201":
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/User'
        "400":
          description: Faltan campos obligatorios o el rol es invalido (VALIDATION_ERROR, INVALID_USER_ROLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Ya existe un usuario con ese email (USER_ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/{uid}:
    get:
      summary: Obtener usuario por ID
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string
      responses:
        "200":
          description: Usuario obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/User'
        "404":
          description: El usuario no existe (USER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{uid}/documents:
    post:
      summary: Sube un documento de un usuario
      description: >-
        Recibe el archivo en el campo document y el tipo de documento en el campo type.
        Guarda el archivo en uploads/documents y deja los metadatos dentro del usuario.
        Tipos de archivo aceptados: PDF, JPEG, PNG y WEBP. Tamano maximo 5 MB.
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario al que se le asocia el documento
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
                - type
              properties:
                document:
                  type: string
                  format: binary
                  description: El archivo. PDF, JPEG, PNG o WEBP, hasta 5 MB.
                type:
                  type: string
                  enum: [user_document, driver_license, delivery_proof]
                  example: user_document
                  description: Tipo de documento
      responses:
        "200":
          description: Documento cargado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/User'
        "400":
          description: >-
            Falta el archivo (FILE_REQUIRED), el tipo de archivo no esta permitido
            (INVALID_FILE_TYPE), supera los 5 MB (FILE_TOO_LARGE), el campo no es
            document (INVALID_FILE_FIELD) o el tipo de documento no es valido
            (INVALID_DOCUMENT_TYPE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: El usuario no existe (USER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: No se pudo guardar el archivo (UPLOAD_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
