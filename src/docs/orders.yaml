paths:
  /api/orders:
    get:
      summary: Lista de pedidos
      description: Devuelve los pedidos. Los filtros son opcionales y se pueden combinar.
      tags:
        - Orders
      parameters:
        - name: customer
          in: query
          required: false
          description: Filtra por ID del cliente
          schema:
            type: string
        - name: store
          in: query
          required: false
          description: Filtra por ID del local
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filtra por e estado
          schema:
            type: string
            enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
      responses:
        "200":
          description: Lista de pedidos obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        "400":
          description: El estado enviado no es valido (INVALID_ORDER_STATUS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Crear un pedido
      description: El total lo calcula la API a partir de los items. El pedido sale con el estado created.
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer
                - store
                - deliveryAddress
                - items
              properties:
                customer:
                  type: string
                  description: ID de un usuario existente
                  example: 68af3c9e12ab4d5e6f708192
                store:
                  type: string
                  description: ID de un local existente
                  example: 68af3c9e12ab4d5e6f708abc
                deliveryAddress:
                  type: string
                  example: Av. Rivadavia 5400
                priority:
                  type: string
                  enum: [low, normal, high]
                  example: normal
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderItem'
      responses:
        "201":
          description: Pedido creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/Order'
        "400":
          description: Faltan campos no hay items o algun item es invalido (VALIDATION_ERROR, ORDER_ITEMS_REQUIRED, INVALID_ORDER_ITEM)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: El cliente o el local no existen (USER_NOT_FOUND, STORE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{oid}:
    get:
      summary: Obtener pedido por ID
      tags:
        - Orders
      parameters:
        - name: oid
          in: path
          required: true
          description: ID del pedido
          schema:
            type: string
      responses:
        "200":
          description: Pedido obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/Order'
        "404":
          description: El pedido no existe (ORDER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{oid}/status:
    put:
      summary: Cambiar el estado de un pedido
      description: Un pedido en delivered o cancelled ya no permite cambios.
      tags:
        - Orders
      parameters:
        - name: oid
          in: path
          required: true
          description: ID del pedido
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
                  example: assigned
      responses:
        "200":
          description: Estado actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/Order'
        "400":
          description: El estado enviado no es valido (INVALID_ORDER_STATUS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: El pedido no existe (ORDER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: El pedido ya esta entregado o cancelado (ORDER_ALREADY_CLOSED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'